name: Feature Request
description: Suggest a new feature or improvement for Fast Flip! Token Tools
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please describe what you'd like and why.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation at the table where the current module falls short.
      placeholder: As a GM, I want... because...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
      description: A clear description of the feature or change you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the problem, including modules or workarounds you've tried.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, screenshots, or links that help explain the idea.
